[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "novapilot"
version = "0.1.0"
description = "Lightweight Terminal AI Personal Super Intelligence Engine"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "NovaPilot Contributors"},
]
keywords = ["ai", "cli", "llm", "terminal", "chatbot", "privacy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Environment :: Console",
]

[project.scripts]
novapilot = "novapilot.cli:main"

[tool.setuptools]
packages = ["novapilot", "novapilot.llm", "novapilot.chat", "novapilot.tools", "novapilot.memory", "novapilot.tui", "novapilot.utils"]

[tool.setuptools.package-data]
novapilot = ["py.typed"]
